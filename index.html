<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-SED — Phishing &amp; Social Engineering Detector</title>
<style>
  :root{
    --bg:#0F1720;
    --panel:#16202B;
    --panel-2:#1C2833;
    --line:#263340;
    --text:#E7EDF3;
    --muted:#8CA0B3;
    --accent:#2FB7A5;
    --accent-dim:#1D6E64;
    --danger:#E5484D;
    --warn:#E8A33D;
    --ok:#3DD68C;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(47,183,165,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:48px 20px 80px;
  }
  .wrap{max-width:820px;margin:0 auto;}

  header{margin-bottom:32px;}
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand .mark{
    font-family:var(--mono);
    font-size:13px;
    color:var(--accent);
    border:1px solid var(--accent-dim);
    padding:3px 8px;
    border-radius:4px;
    letter-spacing:0.02em;
  }
  h1{
    font-size:28px;
    font-weight:600;
    margin:14px 0 6px;
    letter-spacing:-0.01em;
  }
  header p{
    color:var(--muted);
    font-size:15px;
    max-width:60ch;
    line-height:1.5;
    margin:0;
  }

  .tabs{display:flex;gap:2px;margin:32px 0 0;border-bottom:1px solid var(--line);}
  .tab{
    font-family:var(--sans);
    font-size:14px;
    color:var(--muted);
    background:none;
    border:none;
    padding:12px 4px;
    margin-right:24px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--text);border-bottom-color:var(--accent);}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:24px;
    margin-top:20px;
  }

  .field-row{display:flex;gap:10px;}
  input[type=text], textarea{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:14px;
    padding:12px 14px;
    border-radius:6px;
    outline:none;
    transition:border-color .15s ease;
  }
  input[type=text]:focus, textarea:focus{border-color:var(--accent);}
  textarea{width:100%;min-height:120px;resize:vertical;line-height:1.5;}

  button.run{
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    color:#08211D;
    background:var(--accent);
    border:none;
    padding:0 22px;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s ease, transform .05s ease;
  }
  button.run:hover{background:#3ECFBC;}
  button.run:active{transform:translateY(1px);}

  .hint{color:var(--muted);font-size:12.5px;margin-top:10px;font-family:var(--mono);}
  .hint button{
    background:none;border:none;color:var(--accent);cursor:pointer;
    font-family:var(--mono);font-size:12.5px;padding:0;text-decoration:underline;
    text-underline-offset:2px;
  }

  .result{margin-top:28px;display:none;}
  .result.show{display:block;}

  .scoreband{
    display:flex;align-items:center;gap:20px;
    padding:18px 20px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-2);
  }
  .score-num{font-family:var(--mono);font-size:36px;font-weight:600;line-height:1;}
  .score-num span{font-size:16px;color:var(--muted);font-weight:400;}
  .verdict-block{flex:1;}
  .verdict{font-size:16px;font-weight:600;margin-bottom:3px;}
  .verdict-sub{font-size:13px;color:var(--muted);}
  .bar-track{width:100%;height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;transition:width .4s ease;}

  .findings{margin-top:20px;}
  .findings h3{
    font-size:12px;text-transform:none;color:var(--muted);
    font-weight:600;margin:0 0 10px;letter-spacing:0.01em;
  }
  .finding{
    display:flex;gap:12px;
    padding:11px 0;
    border-top:1px solid var(--line);
    font-size:13.5px;
  }
  .finding:first-child{border-top:none;}
  .finding .badge{
    font-family:var(--mono);
    font-size:11px;
    flex:0 0 64px;
    padding:2px 6px;
    border-radius:4px;
    text-align:center;
    height:fit-content;
  }
  .finding .body{flex:1;}
  .finding .rule{font-family:var(--mono);color:var(--text);margin-bottom:2px;}
  .finding .detail{color:var(--muted);line-height:1.4;}

  .sev-HIGH{background:rgba(229,72,77,0.15);color:var(--danger);}
  .sev-MEDIUM{background:rgba(232,163,61,0.15);color:var(--warn);}
  .sev-LOW{background:rgba(140,160,179,0.15);color:var(--muted);}

  .empty-note{color:var(--muted);font-size:13.5px;padding:6px 0 0;}

  footer{margin-top:56px;color:var(--muted);font-size:12.5px;text-align:center;}
  footer code{font-family:var(--mono);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="mark">P-SED</span>
    </div>
    <h1>Phishing &amp; Social Engineering Detector</h1>
    <p>Paste a link or a message below. Every check runs locally in this page — nothing you enter is sent anywhere.</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="url">Analyze a link</button>
    <button class="tab" data-tab="text">Analyze a message</button>
  </div>

  <div class="panel" id="panel-url">
    <div class="field-row">
      <input type="text" id="url-input" placeholder="http://paypa1-secure-login.tk/verify-account" autocomplete="off" spellcheck="false">
      <button class="run" id="url-run">Scan</button>
    </div>
    <div class="hint">try <button data-sample="url" data-value="http://paypa1-secure-login.tk/verify-account?id=88213">a lookalike link</button> or <button data-sample="url" data-value="https://www.wikipedia.org">a clean one</button></div>
  </div>

  <div class="panel" id="panel-text" style="display:none;">
    <textarea id="text-input" placeholder="Dear Customer, your account will be suspended within 24 hours unless you verify your identity..."></textarea>
    <div style="display:flex;justify-content:flex-end;margin-top:12px;">
      <button class="run" id="text-run">Scan</button>
    </div>
    <div class="hint">try <button data-sample="text" data-value="Dear Customer, your account will be suspended within 24 hours. Click here to confirm your password immediately or face permanent closure.">a pressure-tactic message</button></div>
  </div>

  <div class="result" id="result">
    <div class="scoreband">
      <div class="score-num" id="score-num">0<span>/100</span></div>
      <div class="verdict-block">
        <div class="verdict" id="verdict-text">—</div>
        <div class="verdict-sub" id="verdict-sub">—</div>
        <div class="bar-track"><div class="bar-fill" id="bar-fill" style="width:0%;"></div></div>
      </div>
    </div>
    <div class="findings">
      <h3>Findings</h3>
      <div id="findings-list"></div>
    </div>
  </div>

  <footer>Static heuristic analysis only — a low score does not guarantee safety. <code>P-SED / LOCK-IN demo suite</code></footer>
</div>

<script>
// ---------------------------------------------------------------------
// Reference data (client-side port of the P-SED heuristic engine)
// ---------------------------------------------------------------------
const SUSPICIOUS_TLDS = new Set(["tk","ml","ga","cf","gq","top","xyz","work","click","link","zip","mov","gdn","country","stream","download","review","loan","men","bid","date","faith","party","racing","win"]);
const URL_SHORTENERS = new Set(["bit.ly","tinyurl.com","t.co","goo.gl","ow.ly","is.gd","buff.ly","adf.ly","rb.gy","cutt.ly","rebrand.ly","tiny.cc","lnkd.in","shorturl.at"]);
const SUSPICIOUS_KEYWORDS = ["login","signin","verify","verification","account","secure","security","update","confirm","password","credential","billing","invoice","payment","suspend","suspended","locked","unlock","urgent","alert","banking","wallet","reset","authenticate","validate","expire","expires","recover"];
const BRAND_DOMAINS = {
  paypal:"paypal.com", google:"google.com", microsoft:"microsoft.com", apple:"apple.com",
  amazon:"amazon.com", facebook:"facebook.com", instagram:"instagram.com", netflix:"netflix.com",
  chase:"chase.com", dropbox:"dropbox.com", linkedin:"linkedin.com", coinbase:"coinbase.com",
  docusign:"docusign.com", outlook:"outlook.com", irs:"irs.gov", usps:"usps.com",
  fedex:"fedex.com", adobe:"adobe.com"
};
const URGENCY = [/\bact\s+now\b/i,/\bimmediately\b/i,/\burgent(ly)?\b/i,/\bwithin\s+\d+\s+(hours?|days?|minutes?)\b/i,/\bfinal\s+notice\b/i,/\blast\s+(chance|warning)\b/i,/\baccount\s+will\s+be\s+(suspended|closed|locked|terminated)\b/i,/\bimmediate\s+action\s+required\b/i,/\bexpires?\s+(today|soon)\b/i,/\bfailure\s+to\s+(respond|comply|act)\b/i];
const AUTHORITY = [/\b(irs|internal\s+revenue\s+service)\b/i,/\bfbi\b/i,/\bpolice\s+department\b/i,/\bhuman\s+resources\b/i,/\bit\s+department\b/i,/\blegal\s+department\b/i,/\bcourt\s+order\b/i];
const REWARD_FEAR = [/\byou\s+(have\s+)?won\b/i,/\bcongratulations\b/i,/\bclaim\s+your\b/i,/\bfree\s+gift\b/i,/\btax\s+refund\b/i,/\bunauthorized\s+(access|login|transaction)\b/i,/\bsuspicious\s+activity\b/i,/\bverify\s+your\s+identity\b/i,/\bconfirm\s+your\s+(account|password|identity)\b/i];
const CRED_REQUEST = [/\bsend\s+(us\s+)?your\s+(password|ssn|social\s+security|pin|otp|one[- ]time\s+code)\b/i,/\breply\s+with\s+your\b/i,/\benter\s+your\s+(password|credentials|card\s+number)\b/i,/\bclick\s+(here|the\s+link)\s+to\s+(verify|confirm|update)\b/i];
const GREETING = [/\bdear\s+(customer|user|valued\s+customer|sir\/madam|member)\b/i];
const PAYMENT = [/\b(wire\s+transfer|gift\s+card|bitcoin|crypto(currency)?|itunes\s+card)\b/i];

function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j]=Math.min(
        dp[i-1][j]+1,
        dp[i][j-1]+1,
        dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
      );
    }
  }
  return dp[m][n];
}
function similarity(a,b){
  const dist=levenshtein(a,b);
  return 1 - dist/Math.max(a.length,b.length,1);
}

function analyzeUrl(raw){
  let input=raw.trim();
  if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(input)) input="http://"+input;
  let url;
  try{ url=new URL(input); }catch(e){
    return {score:20,findings:[{rule:"MALFORMED_URL",severity:"MEDIUM",detail:"Could not parse this as a URL."}]};
  }
  const host=(url.hostname||"").toLowerCase();
  const findings=[];
  let score=0;
  const add=(rule,severity,detail,weight)=>{findings.push({rule,severity,detail});score+=weight;};

  if(!host){ add("MALFORMED_URL","MEDIUM","Could not parse a hostname from input.",25); return {score,findings}; }

  if(/^(\d{1,3}\.){3}\d{1,3}$/.test(host)) add("IP_LITERAL_HOST","MEDIUM",`URL uses a raw IP address (${host}) instead of a domain.`,20);
  if(input.split("://")[1] && input.split("://")[1].includes("@")) add("AT_SYMBOL","MEDIUM","URL contains '@', often used to disguise the real destination.",20);
  if(url.port && !["80","443",""].includes(url.port)) add("NONSTANDARD_PORT","LOW",`Uses non-standard port ${url.port}.`,10);
  if(url.protocol!=="https:") add("NO_HTTPS","LOW","URL does not use HTTPS.",8);
  if(input.length>90) add("LONG_URL","LOW",`URL is unusually long (${input.length} chars).`,6);

  const subCount=Math.max(0, host.split(".").length-2);
  if(subCount>=3) add("MANY_SUBDOMAINS","MEDIUM",`${subCount} subdomain labels before the root domain.`,12);

  const firstLabel=host.split(".")[0];
  if((firstLabel.match(/-/g)||[]).length>=2) add("HYPHENATED_DOMAIN","LOW",`Domain label '${firstLabel}' has multiple hyphens.`,8);

  const parts=host.split(".");
  const tld=parts[parts.length-1];
  if(SUSPICIOUS_TLDS.has(tld)) add("SUSPICIOUS_TLD","MEDIUM",`Top-level domain '.${tld}' is commonly abused for phishing.`,15);

  const registrable=parts.slice(-2).join(".");
  if(URL_SHORTENERS.has(registrable)||URL_SHORTENERS.has(host)) add("URL_SHORTENER","MEDIUM","URL uses a shortening service, hiding the true destination.",12);

  const pathQuery=(url.pathname+" "+url.search).toLowerCase();
  const kwHits=SUSPICIOUS_KEYWORDS.filter(k=>pathQuery.includes(k)||host.includes(k));
  if(kwHits.length) add("SUSPICIOUS_KEYWORDS","MEDIUM",`Contains phishing-associated keywords: ${kwHits.slice(0,6).join(", ")}.`,Math.min(18,4*kwHits.length));

  if(host.includes("xn--")) add("PUNYCODE_DOMAIN","HIGH","Domain uses punycode (xn--), which can hide lookalike Unicode characters.",18);
  else if(/[^\x00-\x7F]/.test(host)) add("NON_ASCII_HOST","HIGH","Hostname contains non-ASCII characters (possible homograph attack).",18);

  const domainCore=registrable.split(".")[0];
  let bestBrand=null,bestRatio=0;
  for(const [brand,legit] of Object.entries(BRAND_DOMAINS)){
    if(host===legit||host.endsWith("."+legit)){ bestBrand=null; break; }
    const r=similarity(domainCore,brand);
    if(r>0.72 && domainCore!==brand && r>bestRatio){ bestBrand=brand; bestRatio=r; }
  }
  if(bestBrand) add("BRAND_TYPOSQUAT","HIGH",`Domain closely resembles '${bestBrand}' (similarity ${bestRatio.toFixed(2)}) but is not the real domain.`,25);

  for(const [brand,legit] of Object.entries(BRAND_DOMAINS)){
    if(host.includes(brand) && !(host===legit||host.endsWith("."+legit))){
      add("BRAND_IN_SUBDOMAIN","HIGH",`'${brand}' appears in the hostname but the actual domain is not ${legit}.`,20);
      break;
    }
  }

  return {score,findings};
}

function analyzeText(text){
  const findings=[];
  let score=0;
  const add=(rule,severity,detail,weight)=>{findings.push({rule,severity,detail});score+=weight;};
  const count=(arr)=>arr.filter(p=>p.test(text)).length;

  const urg=count(URGENCY);
  if(urg) add("URGENCY_LANGUAGE","MEDIUM",`${urg} urgency/pressure phrase(s) detected.`,Math.min(20,6*urg));
  const auth=count(AUTHORITY);
  if(auth) add("AUTHORITY_IMPERSONATION","MEDIUM",`References an authority figure/institution (${auth} match(es)).`,Math.min(15,6*auth));
  const rf=count(REWARD_FEAR);
  if(rf) add("REWARD_OR_FEAR_HOOK","MEDIUM",`Uses reward or fear-based hooks (${rf} match(es)).`,Math.min(20,7*rf));
  const cred=count(CRED_REQUEST);
  if(cred) add("CREDENTIAL_HARVESTING","HIGH","Directly requests credentials, codes, or sensitive data.",25);
  const greet=count(GREETING);
  if(greet) add("GENERIC_GREETING","LOW","Uses a generic greeting instead of a personalized name.",8);
  const urls=(text.match(/https?:\/\/[^\s<>"']+/g)||[]);
  if(urls.length) add("EMBEDDED_LINKS","LOW",`Contains ${urls.length} embedded URL(s) — check each with the link scanner.`,5);
  if(count(PAYMENT)) add("UNUSUAL_PAYMENT_REQUEST","MEDIUM","Requests payment via wire transfer, gift cards, or cryptocurrency.",20);

  return {score,findings};
}

function verdictFor(score){
  score=Math.max(0,Math.min(100,score));
  if(score>=70) return {label:"CRITICAL",sub:"Very likely malicious",color:"var(--danger)"};
  if(score>=45) return {label:"HIGH RISK",sub:"Strong phishing indicators",color:"var(--danger)"};
  if(score>=20) return {label:"MEDIUM RISK",sub:"Some suspicious signals",color:"var(--warn)"};
  if(score>0)   return {label:"LOW RISK",sub:"Minor signals, likely benign",color:"var(--ok)"};
  return {label:"CLEAN",sub:"No indicators detected",color:"var(--ok)"};
}

function render(result){
  const score=Math.max(0,Math.min(100,result.score));
  const v=verdictFor(score);
  document.getElementById("score-num").innerHTML=score+"<span>/100</span>";
  document.getElementById("verdict-text").textContent=v.label;
  document.getElementById("verdict-text").style.color=v.color;
  document.getElementById("verdict-sub").textContent=v.sub;
  const fill=document.getElementById("bar-fill");
  fill.style.width=score+"%";
  fill.style.background=v.color;

  const list=document.getElementById("findings-list");
  list.innerHTML="";
  if(!result.findings.length){
    list.innerHTML='<div class="empty-note">No indicators triggered.</div>';
  } else {
    const order={HIGH:0,MEDIUM:1,LOW:2};
    result.findings.sort((a,b)=>order[a.severity]-order[b.severity]);
    for(const f of result.findings){
      const row=document.createElement("div");
      row.className="finding";
      row.innerHTML=`<div class="badge sev-${f.severity}">${f.severity}</div>
        <div class="body"><div class="rule">${f.rule}</div><div class="detail">${f.detail}</div></div>`;
      list.appendChild(row);
    }
  }
  document.getElementById("result").classList.add("show");
}

// ---- wiring ----
document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    const which=tab.dataset.tab;
    document.getElementById("panel-url").style.display = which==="url" ? "block":"none";
    document.getElementById("panel-text").style.display = which==="text" ? "block":"none";
    document.getElementById("result").classList.remove("show");
  });
});

document.getElementById("url-run").addEventListener("click",()=>{
  const val=document.getElementById("url-input").value;
  if(!val.trim())return;
  render(analyzeUrl(val));
});
document.getElementById("text-run").addEventListener("click",()=>{
  const val=document.getElementById("text-input").value;
  if(!val.trim())return;
  render(analyzeText(val));
});
document.getElementById("url-input").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("url-run").click(); });

document.querySelectorAll("[data-sample]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(btn.dataset.sample==="url"){
      document.getElementById("url-input").value=btn.dataset.value;
      render(analyzeUrl(btn.dataset.value));
    } else {
      document.getElementById("text-input").value=btn.dataset.value;
      render(analyzeText(btn.dataset.value));
    }
  });
});
</script>
</body>
</html>
